<!DOCTYPE html>

<html>

<head>
  <title>Muokkaa ilmoitusta</title>
</head>

<body>

  <div style="text-align: right;">
    {% if session.username %}
    Kirjautuneena sisään <a href="/user/{{ session.user_id }}">{{ session.username }}</a>
    <a href="/messages">Viestit</a>
    {% endif %}
  </div>

  <h1>Muokkaa ilmoitusta</h1>

  {% if error %}
  <p style="color: red;">VIRHE: {{ error }}</p>
  {% endif %}

  <form action="/update_item/{{ item.id }}" method="post">
    <p>
      Otsikko: <br />
      <input type="text" name="title" value="{{ item.title }}" required />
    </p>

    <p>
      Kuvaus: <br />
      <textarea name="description" rows="8" cols="50" required>{{ item.description }}</textarea>
    </p>

    <p>
      Luokitus: <br />
      <select name="category" required>
        {% for category in categories %}
        <option value="{{ category }}" {% if category == item.category %}selected{% endif %}>
          {{ category }}
        </option>
        {% endfor %}
      </select>
    </p>

    <p>
      Sijainti: <br />
      <input type="text" name="location" value="{{ item.location }}" />
    </p>

    <p>
      Maksettava palkkio: <br />
      <input type="number" name="reward" value="{{ item.reward }}" required min="0" step="1" /> €
    </p>

    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="Tallenna muutokset" />
  </form>

  <p>
    <a href="/item/{{ item.id }}">Takaisin ilmoitukseen</a>
  </p>

</body>

</html>
