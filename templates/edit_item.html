<!DOCTYPE html>
<html>

<head>
  <title>Muokkaa ilmoitusta</title>
</head>

<body>
  <h1>Muokkaa ilmoitusta</h1>

  <form action="/update_item/{{ item.id }}" method="post">
    <p>
      Otsikko: <br />
      <input type="text" name="title" value="{{ item.title }}" />
    </p>

    <p>
      Kuvaus: <br />
      <textarea name="description" rows="8" cols="50">{{ item.description }}</textarea>
    </p>

    <p>
      Sijainti: <br />
      <input type="text" name="location" value="{{ item.location }}" />
    </p>

    <p>
      Maksettava palkkio: <br />
      <input type="text" name="reward" value="{{ item.reward }}" /> €
    </p>

    <input type="submit" value="Tallenna muutokset" />
  </form>

  <p>
    <a href="/item/{{ item.id }}">Takaisin ilmoitukseen</a>
  </p>
</body>

</html>
