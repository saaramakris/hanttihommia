<!DOCTYPE html>

<html>

<head>
  <title>Uusi ilmoitus</title>
</head>

<body>

  <div style="text-align: right;">
    {% if session.username %}
    Kirjautuneena sisään <a href="/user/{{ session.user_id }}">{{ session.username }}</a>
    <a href="/messages">Viestit</a>
    {% endif %}
  </div>

  <div style="max-width: 700px; margin: auto;">
  
    <h1 style="text-align: center;">Uusi ilmoitus</h1>

    {% if error %}
    <p style="color: red;">VIRHE: {{ error }}</p>
    {% endif %}

    <form action="/create_item" method="post" style="max-width: 500px; margin: auto;">
      <p>
        Otsikko: <br />
        <input type="text" name="title" value="{{ form.title if form else '' }}" required />
      </p>

      <p>
        Kuvaus: <br />
        <textarea name="description" rows="8" cols="50" required>{{ form.description if form else '' }}</textarea>
      </p>

      <p>
        Luokitus: <br />
        <select name="category" required>
          {% for category in categories %}
          <option value="{{ category }}" {% if form and form.category == category %}selected{% endif %}>
            {{ category }}
          </option>
          {% endfor %}
        </select>
      </p>

      <p>
        Sijainti: <br />
        <input type="text" name="location" value="{{ form.location if form else '' }}" />
      </p>

      <p>
        Maksettava palkkio: <br />
        <input type="number" name="reward" value="{{ form.reward if form else '' }}" required min="0" step="1" /> €
      </p>

      <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
      <input type="submit" value="Luo ilmoitus" />
    </form>

    <p style="text-align: center;">
      <a href="/">Takaisin etusivulle</a>
    </p>

  </div>

</body>

</html>
